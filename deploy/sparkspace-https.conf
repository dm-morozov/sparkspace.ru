server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sparkspace.ru www.sparkspace.ru;
    ssl_certificate /etc/letsencrypt/live/sparkspace.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sparkspace.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SPARKSPACE:1m;
    ssl_session_timeout 1d;
    if ($host = www.sparkspace.ru) { return 308 https://sparkspace.ru$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
